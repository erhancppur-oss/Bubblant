name: Android build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore upload keystore (optional)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Unit tests (all 60 levels solvable)
        run: chmod +x gradlew && ./gradlew testDebugUnitTest

      - name: Build debug APK and release bundle
        env:
          ORG_GRADLE_PROJECT_ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ORG_GRADLE_PROJECT_ADMOB_BANNER: ${{ secrets.ADMOB_BANNER }}
          ORG_GRADLE_PROJECT_ADMOB_INTERSTITIAL: ${{ secrets.ADMOB_INTERSTITIAL }}
          ORG_GRADLE_PROJECT_ADMOB_REWARDED: ${{ secrets.ADMOB_REWARDED }}
        run: ./gradlew assembleDebug bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: bubblant-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bubblant-release-aab
          path: app/build/outputs/bundle/release/*.aab
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
